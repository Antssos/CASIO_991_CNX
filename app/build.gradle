plugins { id 'com.android.application' }
android {
 namespace 'org.fx991cnx.emulator'
 compileSdk 35
 buildToolsVersion "35.0.0"
 ndkVersion '27.2.12479018'
 defaultConfig {
  applicationId 'org.fx991cnx.emulator'
  minSdk 29
  targetSdk 35
  versionCode 5
  versionName '0.5.0-preview'
  testInstrumentationRunner 'android.test.InstrumentationTestRunner'
  externalNativeBuild { cmake { cppFlags '-std=c++17' } }
 }
 signingConfigs {
  release {
   storeFile file(System.getenv('FX_KEYSTORE') ?: "${System.getProperty('user.home')}/.android/debug.keystore")
   storePassword System.getenv('FX_STORE_PASSWORD') ?: 'android'
   keyAlias System.getenv('FX_KEY_ALIAS') ?: 'androiddebugkey'
   keyPassword System.getenv('FX_KEY_PASSWORD') ?: 'android'
  }
 }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 splits { abi { enable true; reset(); include 'arm64-v8a','x86_64'; universalApk false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 applicationVariants.all { variant -> variant.outputs.all { output ->
  outputFileName="fx991cnx-${output.getFilter(com.android.build.OutputFile.ABI)=='arm64-v8a'?'arm64':'x86_64'}-${variant.buildType.name}.apk"
 } }
}

dependencies {
 implementation "com.caverock:androidsvg-aar:1.4"
 androidTestCompileOnly files("${android.sdkDirectory}/platforms/android-35/optional/android.test.runner.jar", "${android.sdkDirectory}/platforms/android-35/optional/android.test.base.jar", "${android.sdkDirectory}/platforms/android-35/optional/android.test.mock.jar")
}

// Optional licensed-ROM build. Public builds leave this generated directory empty.
// Supply both files only after verifying redistribution rights for this firmware.
def firmwareAssets = layout.buildDirectory.dir('generated/licensedFirmwareAssets')
android.sourceSets.main.assets.srcDir(firmwareAssets)
def firmwareFile = providers.gradleProperty('licensedRomFile')
def firmwareGrant = providers.gradleProperty('romLicenseFile')
tasks.register('prepareLicensedFirmware') {
 outputs.dir(firmwareAssets)
 outputs.upToDateWhen { false }
 doLast {
  def folder = firmwareAssets.get().asFile
  delete(folder)
  if (firmwareFile.isPresent() != firmwareGrant.isPresent()) {
   throw new GradleException('licensedRomFile and romLicenseFile must both be provided')
  }
  if (firmwareFile.isPresent()) {
   def rom = file(firmwareFile.get())
   def grant = file(firmwareGrant.get())
   if (!rom.isFile() || rom.length() != 262144 || !grant.isFile() || grant.length() == 0) {
    throw new GradleException('A complete 256 KiB fx-991CN X ROM and redistribution grant are required')
   }
   copy { from rom; into new File(folder, 'firmware'); rename { 'fx991cnx.rom' } }
   copy { from grant; into new File(folder, 'firmware'); rename { 'REDISTRIBUTION-LICENSE.txt' } }
  }
 }
}
tasks.named('preBuild').configure { dependsOn('prepareLicensedFirmware') }
