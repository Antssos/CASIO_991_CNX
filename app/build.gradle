plugins { id 'com.android.application' }
android {
 namespace 'org.fx991cnx.emulator'
 compileSdk 35
 buildToolsVersion "35.0.0"
 ndkVersion '27.2.12479018'
 defaultConfig {
  applicationId 'org.fx991cnx.emulator'
  minSdk 29
  targetSdk 35
  versionCode 1
  versionName '0.1.0-preview'
  testInstrumentationRunner 'android.test.InstrumentationTestRunner'
  externalNativeBuild { cmake { cppFlags '-std=c++17' } }
 }
 signingConfigs {
  release {
   storeFile file(System.getenv('FX_KEYSTORE') ?: "${System.getProperty('user.home')}/.android/debug.keystore")
   storePassword System.getenv('FX_STORE_PASSWORD') ?: 'android'
   keyAlias System.getenv('FX_KEY_ALIAS') ?: 'androiddebugkey'
   keyPassword System.getenv('FX_KEY_PASSWORD') ?: 'android'
  }
 }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 splits { abi { enable true; reset(); include 'arm64-v8a','x86_64'; universalApk false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 applicationVariants.all { variant -> variant.outputs.all { output ->
  outputFileName="fx991cnx-${output.getFilter(com.android.build.OutputFile.ABI)=='arm64-v8a'?'arm64':'x86_64'}-${variant.buildType.name}.apk"
 } }
}

dependencies {
 androidTestCompileOnly files("${android.sdkDirectory}/platforms/android-35/optional/android.test.runner.jar", "${android.sdkDirectory}/platforms/android-35/optional/android.test.base.jar", "${android.sdkDirectory}/platforms/android-35/optional/android.test.mock.jar")
}
