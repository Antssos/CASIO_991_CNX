name: Build APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Preview signing key
        run: |
          mkdir -p "$HOME/.android"
          test -f "$HOME/.android/debug.keystore" || keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
      - name: Build installable release APKs only
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Check APK signature, alignment and packaged assets
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/fx991cnx-arm64-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/fx991cnx-arm64-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/release/fx991cnx-arm64-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/fx991cnx-arm64-release.apk
          python - <<'PY_PACKAGE'
          from zipfile import ZipFile
          from pathlib import Path
          icon = Path('app/src/main/res/mipmap-nodpi/ic_launcher_foreground.png').read_bytes()
          assert icon[25] == 2  # Approved full-bleed square RGB artwork; no pre-cut corners
          assert icon[16:20] == icon[20:24]
          assert 'android:label="卡西欧计算器"' in Path('app/src/main/AndroidManifest.xml').read_text()
          assert '@color/icon_background' in Path('app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml').read_text()
          assert Path('app/src/main/res/drawable/ic_launcher_foreground.xml').read_text().count('="3%"') == 4
          for path in Path('app/build/outputs/apk/release').glob('*.apk'):
              with ZipFile(path) as archive:
                  names=archive.namelist()
                  assert all('assets/skins/'+theme+'.svg' in names for theme in ['blue','ivory','pink','black'])
                  assert all(b'<text' not in archive.read('assets/skins/'+theme+'.svg') for theme in ['blue','ivory','pink','black'])
                  assert not any(name.endswith(('.rom','.bin')) and name.startswith('assets/') for name in names)
                  print(path.name, 'four built-in faceplates, no bundled ROM')
          PY_PACKAGE
      - name: Package matching source and delivery files
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/release/fx991cnx-arm64-release.apk delivery/
          cp README.md app/BUILD.md LICENSE licenses/THIRD_PARTY_NOTICES.md delivery/
          git archive --format=zip --output="$PWD/delivery/fx991cnx-source.zip" HEAD
          cd delivery
          sha256sum fx991cnx-arm64-release.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fx991cnx-arm64-release
          path: delivery/
          retention-days: 90
