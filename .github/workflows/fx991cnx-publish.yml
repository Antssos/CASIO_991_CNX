name: Publish APK
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main build run ID
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.run_id }}
    steps:
      - name: Verify build
        id: build
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_branch)" = main
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .path)" = .github/workflows/fx991cnx-android.yml
          echo "commit=$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          name: fx991cnx-arm64-release
          path: delivery
      - name: Publish release
        env:
          BUILD_COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          cd delivery
          sha256sum -c SHA256SUMS.txt
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" ../app/build.gradle)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          tag="fx991cnx-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; use a new app version.' >&2
            exit 1
          fi
          printf 'Android 10+ · arm64-v8a\n\n安装 fx991cnx-arm64-release.apk，首次导入 fx-991CN X 的 256 KiB ROM。\n\n源码、构建说明和 SHA-256 随附件提供。\n' > /tmp/fx-release-notes.md
          options=()
          if [[ "$version" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$tag" fx991cnx-arm64-release.apk fx991cnx-source.zip README.md BUILD.md LICENSE THIRD_PARTY_NOTICES.md SHA256SUMS.txt --target "$BUILD_COMMIT" --title "卡西欧计算器 $version" --notes-file /tmp/fx-release-notes.md "${options[@]}"
