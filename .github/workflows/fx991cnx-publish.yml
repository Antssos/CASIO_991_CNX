name: Publish fx991cnx appearance preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fx991cnx-publish.yml']
  workflow_dispatch:
    inputs:
      original_apk_blob:
        description: Optional Git blob SHA for preserving an existing release APK during migration
        required: false
      original_apk_sha256:
        description: Required SHA-256 when original_apk_blob is provided
        required: false
      run_id:
        description: Optional successful build-only run ID
        required: false
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-fx991cnx]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_RUN: ${{ github.event.inputs.run_id }}
      RELEASE_TAG: fx991cnx-v0.6.0-preview
    steps:
      - uses: actions/checkout@v4
      - name: Select the matching build and require success
        id: verified
        run: |
          build_run="$REQUESTED_RUN"
          if test -z "$build_run"; then
            for attempt in $(seq 1 24); do
              build_run=$(gh run list --workflow fx991cnx-android.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              if [[ "$build_run" =~ ^[0-9]+$ ]]; then break; fi
              sleep 5
            done
          fi
          [[ "$build_run" =~ ^[0-9]+$ ]]
          gh run watch "$build_run" --interval 30 --exit-status
          test "$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq .head_branch)" = main
          commit=$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq .head_sha)
          echo "run=$build_run" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verified.outputs.run }}
          name: fx991cnx-arm64-release
          path: verified-artifact
      - name: Preserve the original signed APK during repository migration
        if: github.event.inputs.original_apk_blob != ''
        env:
          ORIGINAL_APK_BLOB: ${{ github.event.inputs.original_apk_blob }}
          ORIGINAL_APK_SHA256: ${{ github.event.inputs.original_apk_sha256 }}
        run: |
          [[ "$ORIGINAL_APK_BLOB" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ORIGINAL_APK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$GH_REPO/git/blobs/$ORIGINAL_APK_BLOB" --jq .content | base64 --decode > verified-artifact/fx991cnx-arm64-release.apk
          cd verified-artifact
          printf '%s  fx991cnx-arm64-release.apk\n' "$ORIGINAL_APK_SHA256" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          printf '\n仓库迁移保留原 0.6 已签名 APK，SHA-256: %s。CI 新构建仅验证新目录可构建；Release APK 沿用原签名。\n' "$ORIGINAL_APK_SHA256" >> VALIDATION.txt
          printf '\n\n## 仓库迁移\n\nRelease 保留原 0.6 APK，SHA-256: %s。新仓库构建验证成功；本次未重新签署发布 APK，保留其原签名。\n' "$ORIGINAL_APK_SHA256" >> TEST_REPORT.md
      - name: Verify delivery and package static theme previews
        env:
          BUILD_RUN: ${{ steps.verified.outputs.run }}
        run: |
          cd verified-artifact
          sha256sum -c SHA256SUMS.txt
          test -f VALIDATION.txt
          test -f theme-previews/blue.png
          test -f theme-previews/ivory.png
          test -f theme-previews/pink.png
          test -f theme-previews/black.png
          zip -qr theme-previews.zip theme-previews
          printf '\n\n## 本次发布构建\n\nhttps://github.com/%s/actions/runs/%s 编译及打包检查成功。按用户要求，未执行 Android 运行测试，由用户安装验收。theme-previews.zip 为静态矢量面板预览，不是运行截图。\n' "$GH_REPO" "$BUILD_RUN" >> TEST_REPORT.md
      - name: Publish installable APK, matching source and documentation
        env:
          VERIFIED_COMMIT: ${{ steps.verified.outputs.commit }}
          BUILD_RUN: ${{ steps.verified.outputs.run }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --prerelease --target "$VERIFIED_COMMIT" --title '卡西欧计算器 0.6.0 · 莫兰迪图标与适中留白'
          fi
          gh release upload "$RELEASE_TAG" verified-artifact/fx991cnx-arm64-release.apk verified-artifact/fx991cnx-source.zip verified-artifact/README.md verified-artifact/BUILD.md verified-artifact/TEST_REPORT.md verified-artifact/THIRD_PARTY_NOTICES.md verified-artifact/LICENSE verified-artifact/SHA256SUMS.txt verified-artifact/VALIDATION.txt verified-artifact/theme-previews.zip --clobber
          cat > /tmp/fx-release-notes.md <<EOF_NOTES
          Android 10+、arm64-v8a。下载 fx991cnx-arm64-release.apk 安装，无需开发环境。

          根据用户给出的真机图重做蓝、白、粉、黑四套面板：品牌区与太阳能板、LCD、四瓣方向键、键帽、全套矢量字符及黄/红/蓝色次功能标记。数字、运算符及定积分模板为独立矢量形状。

          使用用户审定的图 1：鼠尾草绿、米白、浅暖灰的 C／%／= 极简图标。方形原稿不预先裁圆角，自适应前景四边各收进 3%，主体在常见图标窗口约占 68%，比合成预览留白更窄。系统负责最终裁切形状，应用名称仍为卡西欧计算器。

          本轮只修改图标资源和版本；CI 实际编译并检查签名、16 KiB 对齐、权限和内置资源。**按用户要求，未运行 Android 测试；桌面显示效果由用户安装验收。** 保留 0.5 的遮罩修复与原机末页 3主题/4按键，未修改计算核心。附件 theme-previews.zip 是静态面板素材，不是本次桌面截图。

          构建与 Artifact：https://github.com/$GH_REPO/actions/runs/$BUILD_RUN

          仍采用真实 nX-U8 C++/JNI 核心，所有计算由导入的固件执行。**APK 不含 ROM，首次需导入自己有权使用的 fx-991CN X 256 KiB 固件。** 没有广告、网络、存储或录音权限；仅有按键震动所需 VIBRATE 权限。开发签名跨构建可能需要卸载重装，请保留自己的 ROM 文件。本仓库公开，可直接下载。

          附件包含 APK、GPL-3.0 完整源码、中文说明、可复现构建步骤、验证记录、全部许可证、四主题预览及 SHA-256。
          EOF_NOTES
          if test -n '${{ github.event.inputs.original_apk_blob }}'; then
            printf '\n本次为仓库迁移，Release APK 与原仓库 0.6 文件完全相同，保留原签名和 SHA-256，无需因迁仓卸载重装。新仓库的 CI 已独立完成构建验证。\n' >> /tmp/fx-release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --target "$VERIFIED_COMMIT" --notes-file /tmp/fx-release-notes.md
