name: Publish fx991cnx appearance preview
on:
  push:
    branches: [feat/fx991cnx-android]
    paths: ['.github/workflows/fx991cnx-publish.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional successful build-only run ID
        required: false
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-fx991cnx]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_RUN: ${{ github.event.inputs.run_id }}
      RELEASE_TAG: fx991cnx-v0.5.0-preview
    steps:
      - uses: actions/checkout@v4
      - name: Select the matching build and require success
        id: verified
        run: |
          build_run="$REQUESTED_RUN"
          if test -z "$build_run"; then
            for attempt in $(seq 1 24); do
              build_run=$(gh run list --workflow fx991cnx-android.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              if [[ "$build_run" =~ ^[0-9]+$ ]]; then break; fi
              sleep 5
            done
          fi
          [[ "$build_run" =~ ^[0-9]+$ ]]
          gh run watch "$build_run" --interval 30 --exit-status
          test "$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq .head_branch)" = feat/fx991cnx-android
          commit=$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq .head_sha)
          echo "run=$build_run" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verified.outputs.run }}
          name: fx991cnx-arm64-release
          path: verified-artifact
      - name: Verify delivery and package static theme previews
        env:
          BUILD_RUN: ${{ steps.verified.outputs.run }}
        run: |
          cd verified-artifact
          sha256sum -c SHA256SUMS.txt
          test -f VALIDATION.txt
          test -f theme-previews/blue.png
          test -f theme-previews/ivory.png
          test -f theme-previews/pink.png
          test -f theme-previews/black.png
          zip -qr theme-previews.zip theme-previews
          printf '\n\n## 本次发布构建\n\nhttps://github.com/%s/actions/runs/%s 编译及打包检查成功。按用户要求，未执行 Android 运行测试，由用户安装验收。theme-previews.zip 为静态矢量面板预览，不是运行截图。\n' "$GH_REPO" "$BUILD_RUN" >> TEST_REPORT.md
      - name: Publish installable APK, matching source and documentation
        env:
          VERIFIED_COMMIT: ${{ steps.verified.outputs.commit }}
          BUILD_RUN: ${{ steps.verified.outputs.run }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --prerelease --target "$VERIFIED_COMMIT" --title '卡西欧计算器 0.5.0 · 遮罩修复与原机设置扩展'
          fi
          gh release upload "$RELEASE_TAG" verified-artifact/fx991cnx-arm64-release.apk verified-artifact/fx991cnx-source.zip verified-artifact/README.md verified-artifact/BUILD.md verified-artifact/TEST_REPORT.md verified-artifact/THIRD_PARTY_NOTICES.md verified-artifact/LICENSE verified-artifact/SHA256SUMS.txt verified-artifact/VALIDATION.txt verified-artifact/theme-previews.zip --clobber
          cat > /tmp/fx-release-notes.md <<EOF_NOTES
          Android 10+、arm64-v8a。下载 fx991cnx-arm64-release.apk 安装，无需开发环境。

          根据用户给出的真机图重做蓝、白、粉、黑四套面板：品牌区与太阳能板、LCD、四瓣方向键、键帽、全套矢量字符及黄/红/蓝色次功能标记。数字、运算符及定积分模板为独立矢量形状。

          修复共用画笔 alpha 导致每次点击时整机变暗的遮罩问题。SHIFT→MENU 直接打开真实固件 SETUP，只在语言/对比度末页追加 3主题、4按键，移除自建设置首页和关于。按键目录仅包含震动强度、音量，均为 1关2轻3中4重，无当前档位或星号。新菜单采用 12px 中文点阵和原机行距，设置自动保存。桌面名称改为卡西欧计算器，并设置透明底 C／%／= 图标。

          本地已实际执行原生核心/JVM 菜单回归，验证四页识别、原机按键透传、主题/反馈选择及返回逻辑。本次 CI 实际编译并检查签名、16 KiB 对齐、权限和内置资源；**按用户要求，没有执行 Android 运行测试，由用户安装验收**。附件 theme-previews.zip 是静态素材预览，不是设备截图；不宣称像素级完美复刻。

          构建与 Artifact：https://github.com/$GH_REPO/actions/runs/$BUILD_RUN

          仍采用真实 nX-U8 C++/JNI 核心，所有计算由导入的固件执行。**APK 不含 ROM，首次需导入自己有权使用的 fx-991CN X 256 KiB 固件。** 没有广告、网络、存储或录音权限；仅有按键震动所需 VIBRATE 权限。开发签名跨构建可能需要卸载重装，请保留自己的 ROM 文件。私有仓库需有权限的 GitHub 账户下载。

          附件包含 APK、GPL-3.0 完整源码、中文说明、可复现构建步骤、验证记录、全部许可证、四主题预览及 SHA-256。
          EOF_NOTES
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --target "$VERIFIED_COMMIT" --notes-file /tmp/fx-release-notes.md
